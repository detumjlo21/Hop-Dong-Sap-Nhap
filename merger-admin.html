<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07080c">
  <title>PHOENIX 禄 — Merger Admin</title>
  <link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
  <div class="background-grid"></div>
  <main class="page admin-page">
    <header class="hero compact">
      <img src="assets/logo.png" alt="Logo PHOENIX" class="logo small">
      <p class="eyebrow">PHOENIX MERGER CONTROL</p>
      <h1>Merger Admin</h1>
      <p class="subtitle">Quản lý hồ sơ sáp nhập PHOENIX 禄 — Nhánh 3</p>
    </header>

    <section id="loginPanel" class="panel login-panel">
      <h2>Đăng nhập quản trị</h2>
      <p class="muted">Sử dụng tài khoản Supabase Auth đã được cấp quyền trong bảng <code>admins</code>.</p>
      <form id="loginForm">
        <label for="email">Email</label><input id="email" type="email" autocomplete="username" required>
        <label for="password">Mật khẩu</label><input id="password" type="password" autocomplete="current-password" required>
        <button type="submit">ĐĂNG NHẬP</button>
        <p id="loginMessage" class="message"></p>
      </form>
    </section>

    <section id="adminArea" hidden>
      <section class="panel admin-toolbar">
        <div><p class="eyebrow">DASHBOARD</p><h2>Hồ sơ sáp nhập</h2></div>
        <div class="toolbar-actions"><button id="refreshBtn" class="secondary">LÀM MỚI</button><button id="logoutBtn" class="secondary">ĐĂNG XUẤT</button></div>
      </section>

      <section class="metric-grid">
        <article class="metric-card"><span>Tổng hồ sơ</span><strong id="totalCount">0</strong></article>
        <article class="metric-card"><span>Chờ duyệt</span><strong id="pendingCount">0</strong></article>
        <article class="metric-card"><span>Đã xác nhận</span><strong id="approvedCount">0</strong></article>
        <article class="metric-card"><span>Đã khóa</span><strong id="lockedCount">0</strong></article>
      </section>

      <section class="panel">
        <div class="filter-row"><input id="searchInput" placeholder="Tìm mã hồ sơ, quân đoàn, người đại diện, UID..."><select id="statusFilter"><option value="">Tất cả trạng thái</option><option value="pending">Chờ xác nhận</option><option value="approved">Đã xác nhận</option><option value="rejected">Từ chối</option><option value="locked">Đã khóa</option></select></div>
        <p id="adminMessage" class="message"></p>
        <div id="applications" class="applications"><p class="muted">Đang tải...</p></div>
      </section>
    </section>

    <div id="detailModal" class="modal" hidden>
      <div class="modal-backdrop" data-close-modal></div>
      <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-head"><div><p class="eyebrow">CHI TIẾT HỒ SƠ</p><h2 id="modalTitle">--</h2></div><button class="icon-btn secondary" data-close-modal>✕</button></div>
        <div id="modalContent"></div>
        <div id="modalActions" class="modal-actions"></div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=1"></script>
  <script src="admin.js?v=1"></script>
</body>
</html>
